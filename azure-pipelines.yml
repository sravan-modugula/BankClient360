                    Stop-Service -Name "ClientIQ"
                }

                if ($commitMessage -match "npm ci") {
                  Write-Host "Installing dependencies on remote server and cleaning up .npmrc"
                  Invoke-Command -Session $session -ScriptBlock {
                      Set-Location $using:remoteAppPath
                      npm ci --prefer-offline --loglevel=info 2>&1
