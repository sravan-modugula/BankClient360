    environment: 'PreProd'
    pool:
      name: 'ADODeployPool'
    workspace:
      clean: all
    strategy:
      runOnce:
        deploy:
          steps:

          # Moves the built files over to the app server, pulls node_modules, and restarts the service
          - task: PowerShell@2
            displayName: "Deploy to Remote Node.js Server"
            inputs:
              targetType: inline
              script: |
                $remoteServer = "$(ServerName)"
                $remoteAppPath = "$(AppPath)"
                $serviceName = "ClientIQ"
                $commitMessage = "$(commitMessage)"

