steps:

- task: PowerShell@2
  displayName: "Build Start-Server Script"
  inputs:
    targetType: inline
    script: |
    
      Write-Host "Creating remote PowerShell session"
      $session = New-PSSession -ComputerName "$(Servername)"

      Invoke-Command -Session $session -ScriptBlock {
        $content = @(
            '# Set environment variables'
            '$env:NODE_ENV = "development"'
            '$env:PORT = "5000"'
            '$env:HOST = "127.0.0.1"'
            '$env:DATABASE_DIALECT = "sqlserver"'
            '$env:DB_VENDOR = "mssql"'

            '# SQL Server connection'
            '$env:MSSQL_SERVER = "$(DBServer)"'
            '$env:MSSQL_DATABASE = "$(DBName)"'
            '$env:MSSQL_USER = "$(DBUser)"'
            '$env:MSSQL_PASSWORD = "$(DBPassword)"'
            '$env:MSSQL_PORT = "1433"'
            '$env:MSSQL_ENCRYPT = "false"'
            '$env:MSSQL_TRUST_SERVER_CERTIFICATE = "true"'

            '# SSO'
            '$env:SAML_ENABLED = "$(SAMLEnabled)"'
            '$env:SAML_ENTITY_ID="https://$(SAMLHost))"'
            '$env:SAML_ENTRYPOINT="https://portal.fmb.com/IdPServlet?idp_id=$(SAMLIssuer)"'
            '$env:SAML_ISSUER="$(SAMLIssuer)"'
            '$env:SAML_CALLBACK_URL="https://$(SAMLHost)/saml/acs"'
            '$env:SAML_IDP_INITIATED_URL="https://portal.fmb.com/IdPServlet?idp_id=$(SAMLIssuer)"'
            '$env:SAML_CERT="./saml_cert.pem"'
            '# Scope AD-group role mapping to this environment (DEV/TST/STG/PRD).'
            '# Set SAMLRoleEnv per variable group: VG-Preprod=STG, VG-Prod=PRD.'
            '$env:SAML_ROLE_ENV="$(SAMLRoleEnv)"'

            '# Session secret'
            '$env:SESSION_SECRET = "$(SessionSecret)"'

            'Set-Location -Path "C:\ClientIQ"'

            'Write-Host "Starting ClientIQ Server..." -ForegroundColor Green'
            'npx tsx watch --clear-screen=false server/index.ts 2> C:\ClientIQ\logs\errors.log'
        )

        $content | Out-File -FilePath "C:\ClientIQ\Start-Server.ps1" -Encoding ascii
      }

      Write-Host "Closing remote session"
      Remove-PSSession $session